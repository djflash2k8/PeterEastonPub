<!DOCTYPE html>
<html>
<head>
    <title>Debug Authentication</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .result { margin: 10px 0; padding: 10px; background: #f5f5f5; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Authentication Debug Tool</h1>
    
    <div class="test-section">
        <h3>Step 1: Test Login API</h3>
        <button onclick="testLogin()">Test Login API</button>
        <div id="loginResult" class="result"></div>
    </div>
    
    <div class="test-section">
        <h3>Step 2: Check Cookies</h3>
        <button onclick="checkCookies()">Check Current Cookies</button>
        <div id="cookieResult" class="result"></div>
    </div>
    
    <div class="test-section">
        <h3>Step 3: Test Admin Access</h3>
        <button onclick="testAdminAccess()">Test Admin Panel Access</button>
        <div id="adminResult" class="result"></div>
    </div>
    
    <div class="test-section">
        <h3>Step 4: Clear All</h3>
        <button onclick="clearAll()">Clear Cookies & Results</button>
    </div>

    <script>
        async function testLogin() {
            const resultDiv = document.getElementById('loginResult');
            resultDiv.innerHTML = 'Testing login...';
            
            try {
                const response = await fetch('http://localhost:3000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include', // Important for cookies
                    body: JSON.stringify({
                        username: 'admin',
                        password: 'Peter123!'
                    })
                });
                
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <p><strong>Status:</strong> ${response.status}</p>
                    <p><strong>Success:</strong> ${data.success}</p>
                    <p><strong>Message:</strong> ${data.error || 'Success'}</p>
                    <p><strong>Response Headers:</strong></p>
                    <pre>${JSON.stringify([...response.headers.entries()], null, 2)}</pre>
                `;
                
                if (response.ok && data.success) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML += '<p>✅ Login successful! Check cookies now.</p>';
                    // Wait a moment then check cookies
                    setTimeout(checkCookies, 1000);
                } else {
                    resultDiv.className = 'result error';
                }
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
                resultDiv.className = 'result error';
            }
        }
        
        function checkCookies() {
            const resultDiv = document.getElementById('cookieResult');
            const cookies = document.cookie;
            
            resultDiv.innerHTML = `
                <p><strong>All Cookies:</strong></p>
                <pre>${cookies || 'No cookies found'}</pre>
                <p><strong>Admin Auth Cookie:</strong></p>
                <pre>${cookies.includes('admin-auth') ? 'Found: ' + cookies.split('admin-auth=')[1]?.split(';')[0] : 'Not found'}</pre>
            `;
            
            resultDiv.className = cookies.includes('admin-auth') ? 'result success' : 'result error';
        }
        
        async function testAdminAccess() {
            const resultDiv = document.getElementById('adminResult');
            resultDiv.innerHTML = 'Testing admin access...';
            
            try {
                const response = await fetch('http://localhost:3000/admin', {
                    credentials: 'include' // Important for cookies
                });
                
                const text = await response.text();
                
                resultDiv.innerHTML = `
                    <p><strong>Status:</strong> ${response.status}</p>
                    <p><strong>Response:</strong></p>
                    <pre>${text.substring(0, 500)}${text.length > 500 ? '...' : ''}</pre>
                `;
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML += '<p>✅ Admin panel accessible!</p>';
                } else if (response.status === 302 || response.redirected) {
                    resultDiv.className = 'result';
                    resultDiv.innerHTML += '<p>🔄 Redirected to login (expected if not authenticated)</p>';
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML += '<p>❌ Admin panel access failed</p>';
                }
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
                resultDiv.className = 'result error';
            }
        }
        
        function clearAll() {
            // Clear all cookies
            document.cookie.split(";").forEach(function(c) { 
                document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/"); 
            });
            
            // Clear results
            document.getElementById('loginResult').innerHTML = '';
            document.getElementById('cookieResult').innerHTML = '';
            document.getElementById('adminResult').innerHTML = '';
        }
        
        // Check cookies on load
        window.onload = function() {
            checkCookies();
        };
    </script>
</body>
</html>
